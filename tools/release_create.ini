; Config for `release-tool create` (tools\release_create.bat). Only non-defaults are set.
; Comments stay on their own lines: configparser does not strip inline comments.

[Release]
scope = tapo
publish_platform = GitHub Releases
; plain pyproject.toml version, last segment bumped per release (0.3.0 -> 0.3.1)
versioning = semver
english_only = true

[Bats]
build_increment = tools/version_increment.bat
build_decrement = tools/version_decrement.bat
; no publish bat: GitHub Releases runs after commit/tag/push via [GitHubRelease]

[GitHubRelease]
enabled = true
; built by tools/build_release.bat under a stable name
assets = dist/tapo.exe
repo = BenjaminKobjolke/TAPO-P100-Control
